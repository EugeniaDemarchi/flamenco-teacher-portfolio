<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/ASSETS/FAVICON/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/ASSETS/FAVICON/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/ASSETS/FAVICON/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/ASSETS/FAVICON/apple-touch-icon.png"
    />
    <link rel="manifest" href="/ASSETS/FAVICON/site.webmanifest" />
    <title>Contacto</title>
    <link
      rel="preload"
      href="/ASSETS/FONTS/Abel-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./CSS/layout.css" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="./CSS/contacto.css" />
    <link rel="stylesheet" href="./CSS/scroll-to-top.css" />
  </head>
  <body>
    <div id="nav-container" class="nav-container--fixed"></div>
    <h3 class="titulo_seccion">Contacto</h3>
    <section class="contacto__grid">
      <div class="contacto__contenedor-img">
        <picture>
          <source
            type="image/avif"
            srcset="
              /ASSETS/IMAGES/contacto/natalia-riopedre-bailaora-small.avif   768w,
              /ASSETS/IMAGES/contacto/natalia-riopedre-bailaora-medium.avif 1440w,
              /ASSETS/IMAGES/contacto/natalia-riopedre-bailaora-large.avif  1920w
            "
            sizes="100vw"
          />
          <source
            type="image/webp"
            srcset="
              /ASSETS/IMAGES/contacto/natalia-riopedre-bailaora-small.webp   768w,
              /ASSETS/IMAGES/contacto/natalia-riopedre-bailaora-medium.webp 1440w,
              /ASSETS/IMAGES/contacto/natalia-riopedre-bailaora-large.webp  1920w
            "
            sizes="100vw"
          />
          <img
            src="/ASSETS/IMAGES/contacto/natalia-riopedre-bailaora-small.jpg"
            srcset="
              /ASSETS/IMAGES/contacto/natalia-riopedre-bailaora-small.jpg   768w,
              /ASSETS/IMAGES/contacto/natalia-riopedre-bailaora-medium.jpg 1440w,
              /ASSETS/IMAGES/contacto/natalia-riopedre-bailaora-large.jpg  1920w
            "
            sizes="100vw"
            alt="Natalia Riopedre, bailaora de flamenco"
            class="contacto__img"
            loading="lazy"
            decoding="async"
          />
        </picture>
      </div>
      <form
        action="/procesar-datos"
        method="POST"
        id="form"
        class="contacto__form"
      >
        <div class="contacto__campo">
          <label for="nombre" class="visually-hidden">Nombre:</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Nombre"
            required
          />
        </div>
        <div class="contacto__campo">
          <label for="mail" class="visually-hidden">Email:</label>
          <input
            type="text"
            id="mail"
            name="mail"
            placeholder="Mail"
            required
          />
        </div>
        <div class="contacto__campo">
          <label for="mensaje" class="visually-hidden">Mensaje:</label>
          <textarea
            id="mensaje"
            name="mensaje"
            rows="5"
            cols="40"
            placeholder="Mensaje:"
            required
          ></textarea>
        </div>
        <button class="contacto__btn" type="submit">Enviar</button>
      </form>
      <div class="contacto__exito">
        <p>
          ¡Gracias por tu mensaje! <br />
          Te contestaremos a la brevedad
        </p>
        <button class="contacto__btnReiniciar">Enviar otro mensaje</button>
      </div>
    </section>
    <div id="footer-container"></div>
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <script src="./JS/dist/contacto.js" type="module"></script>
    <script src="./JS/dist/main.js" type="module"></script>
  </body>
</html>
