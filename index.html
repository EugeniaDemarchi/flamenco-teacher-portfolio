<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Natalia Riopedre — Flamenco" />
    <meta
      property="og:description"
      content="Bailaora, coreógrafa y docente de flamenco en Buenos Aires. Obras, clases y shows en vivo."
    />
    <meta
      property="og:image"
      content="https://nataliariopedre.netlify.app/ASSETS/SOCIAL/whatsapp.png"
    />
    <meta property="og:url" content="https://nataliariopedre.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="/ASSETS/FAVICON/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/ASSETS/FAVICON/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/ASSETS/FAVICON/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/ASSETS/FAVICON/apple-touch-icon.png"
    />
    <link rel="manifest" href="/ASSETS/FAVICON/site.webmanifest" />
    <title>HOME</title>
    <link
      rel="preload"
      href="/ASSETS/FONTS/Abel-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./CSS/layout.css" />
    <link rel="stylesheet" href="./CSS/index.css" />
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <div id="nav-container" class="nav-container--fixed"></div>
    <section class="hero">
      <picture>
        <source
          srcset="
            ASSETS/IMAGES/hero_small.webp     768w,
            ASSETS/IMAGES/hero_large_hq.webp 1920w
          "
          sizes="100vw"
          type="image/webp"
        />
        <img
          src="./ASSETS/IMAGES/hero_small.webp"
          class="hero-img"
          alt="Natalia Riopedre"
          loading="eager"
        />
      </picture>
    </section>
    <div id="footer-container" class="footer-container--fixed"></div>
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>

    <script src="./JS/dist/main.js" type="module"></script>
  </body>
</html>
