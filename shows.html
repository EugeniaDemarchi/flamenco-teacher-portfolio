<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/ASSETS/FAVICON/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/ASSETS/FAVICON/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/ASSETS/FAVICON/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/ASSETS/FAVICON/apple-touch-icon.png">
<link rel="manifest" href="/ASSETS/FAVICON/site.webmanifest">
    <title>Shows en cartel</title>
      <link
      rel="preload"
      href="/ASSETS/FONTS/Abel-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  <link rel="stylesheet" href="./CSS/dist/base.css" />
<link rel="stylesheet" href="./CSS/dist/components.css" />
<link rel="stylesheet" href="./CSS/dist/shows.css" />

  </head>
  <body>
      <div id="nav-container" class="nav-container--fixed" ></div>
      <div class="shows__img-ppal-container">
<div class="shows__img-ppal-container">
  <picture>
    <source
      type="image/avif"
      srcset="
        /ASSETS/IMAGES/shows/tablao-natalia-riopedre-small.avif   768w,
        /ASSETS/IMAGES/shows/tablao-natalia-riopedre-medium.avif 1440w,
        /ASSETS/IMAGES/shows/tablao-natalia-riopedre-large.avif  1920w
      "
      sizes="100vw"
    />
    <source
      type="image/webp"
      srcset="
        /ASSETS/IMAGES/shows/tablao-natalia-riopedre-small.webp   768w,
        /ASSETS/IMAGES/shows/tablao-natalia-riopedre-medium.webp 1440w,
        /ASSETS/IMAGES/shows/tablao-natalia-riopedre-large.webp  1920w
      "
      sizes="100vw"
    />
    <img
      src="/ASSETS/IMAGES/shows/tablao-natalia-riopedre-small.jpg"
      srcset="
        /ASSETS/IMAGES/shows/tablao-natalia-riopedre-small.jpg   768w,
        /ASSETS/IMAGES/shows/tablao-natalia-riopedre-medium.jpg 1440w,
        /ASSETS/IMAGES/shows/tablao-natalia-riopedre-large.jpg  1920w
      "
      sizes="100vw"
      alt="Natalia Riopedre en un tablao"
      class="shows__img-ppal"
      loading="eager"
      fetchpriority="high"
    />
  </picture>
</div>
      </div>
    <h3 class="titulo_seccion">En cartel</h3> 
      <button id="scrollTopBtn">
        <ion-icon name="chevron-up-outline"></ion-icon>
      </button>
    </div>



    <div class="shows__grid grid-cards"></div>
      <div class="shows__empty-state"></div>
    <div id="footer-container"></div>
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <script src="./JS/dist/ui/render-shows.js" type="module"></script>
    <script src="./JS/dist/main.js" type="module"></script>

</html>
