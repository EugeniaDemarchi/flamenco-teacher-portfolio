<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Conocé las obras de Natalia Riopedre: dirección, coreografía e interpretación en danza flamenca, de Que Me Lleve Donde Quiera a Perimetral y Redes."
    />
    <link rel="icon" type="image/x-icon" href="/ASSETS/FAVICON/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/ASSETS/FAVICON/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/ASSETS/FAVICON/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/ASSETS/FAVICON/apple-touch-icon.png"
    />
    <link rel="manifest" href="/ASSETS/FAVICON/site.webmanifest" />
    <title>Obra | Natalia Riopedre</title>
    <link
      rel="preload"
      href="/ASSETS/FONTS/Abel-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./CSS/dist/base.css" />
    <link rel="stylesheet" href="./CSS/dist/components.css" />
    <link rel="stylesheet" href="./CSS/dist/obras.css" />
  </head>
  <body>
    <div id="nav-container" class="nav-container--fixed"></div>
    <div class="obras_img-ppal-container">
      <div class="obras_img-ppal-container">
        <picture>
          <source
            type="image/avif"
            srcset="
              /ASSETS/IMAGES/obras/perimetral-portada-small.avif   768w,
              /ASSETS/IMAGES/obras/perimetral-portada-medium.avif 1440w,
              /ASSETS/IMAGES/obras/perimetral-portada-large.avif  1920w
            "
            sizes="100vw"
          />
          <source
            type="image/webp"
            srcset="
              /ASSETS/IMAGES/obras/perimetral-portada-small.webp   768w,
              /ASSETS/IMAGES/obras/perimetral-portada-medium.webp 1440w,
              /ASSETS/IMAGES/obras/perimetral-portada-large.webp  1920w
            "
            sizes="100vw"
          />
          <img
            src="/ASSETS/IMAGES/obras/perimetral-portada-small.jpg"
            srcset="
              /ASSETS/IMAGES/obras/perimetral-portada-small.jpg   768w,
              /ASSETS/IMAGES/obras/perimetral-portada-medium.jpg 1440w,
              /ASSETS/IMAGES/obras/perimetral-portada-large.jpg  1920w
            "
            sizes="100vw"
            alt="Natalia Riopedre en la obra Abre Flamenco"
            class="obras__img-ppal"
            loading="eager"
            fetchpriority="high"
          />
        </picture>
      </div>
    </div>
    <h2 class="titulo_seccion">Obra</h2>
    <button id="scrollTopBtn" aria-label="Volver arriba ">
      <ion-icon name="chevron-up-outline" aria-hidden="true"></ion-icon>
    </button>
    <main class="obras__grid"></main>
    <div id="footer-container"></div>
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <script src="./JS/dist/ui/render-obras.js" type="module"></script>
    <script src="./JS/dist/main.js" type="module"></script>
  </body>
</html>
