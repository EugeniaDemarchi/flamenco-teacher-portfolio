<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Descubrí el detalle de cada obra de Natalia Riopedre: dirección, coreografía, interpretación y galería del flamenco contemporáneo argentino."
    />
    <link rel="icon" type="image/x-icon" href="/ASSETS/FAVICON/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/ASSETS/FAVICON/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/ASSETS/FAVICON/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/ASSETS/FAVICON/apple-touch-icon.png"
    />
    <link rel="manifest" href="/ASSETS/FAVICON/site.webmanifest" />
    <title>Obras | Natalia Riopedre</title>
    <link
      rel="preload"
      href="/ASSETS/FONTS/Abel-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/CSS/layout.css" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="./CSS/componentesComunes.css" />
    <link rel="stylesheet" href="./CSS/obra.css" />
    <link rel="stylesheet" href="./CSS/obra-detalle.css" />
  </head>
  <body>
    <div id="nav-container" class="nav-container--fixed"></div>
    <button id="scrollTopBtn" aria-label="Volver arriba">
      <ion-icon name="chevron-up-outline" aria-hidden="true"></ion-icon>
    </button>

    <div class="obra-detalle__container">
      <img src="" alt="" class="obra-detalle__img-ppal" />
      <h2 class="titulo_seccion">Obras</h2>
      <div class="obra-detalle__grid">
        <h3 class="obra-detalle__titulo"></h3>
        <p class="obra-detalle__rol"></p>
        <p class="obra-detalle__descripcion-corta"></p>
        <p class="obra-detalle__anio"></p>
        <div class="obra-detalle__galeria"></div>
        <p class="obra-detalle__descripcion-larga"></p>
        <div class="obra-detalle__video"></div>
      </div>
    </div>

    <div class="obra-detalle__modal">
      <button class="obra-detalle__close-btn">
        <ion-icon
          name="close-outline"
          md="close-sharp"
          class="close-outline"
        ></ion-icon>
      </button>
      <picture class="obra-detalle__modal-picture">
        <source type="image/avif" />
        <source type="image/webp" />
        <img src="" alt="" class="obra-detalle__modal-img" />
      </picture>
    </div>
    <div id="footer-container"></div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <script src="/JS/dist/ui/render-obra-detalle.js" type="module"></script>
    <script src="/JS/dist/main.js" type="module"></script>
  </body>
</html>
