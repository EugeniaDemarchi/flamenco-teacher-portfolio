<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obra Detalle</title>
    <link rel="stylesheet" href="/CSS/layout.css" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="./CSS/componentesComunes.css" />
    <link rel="stylesheet" href="./CSS/obra.css" />
    <link rel="stylesheet" href="./CSS/obra-detalle.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;700&display=swap"
      rel="stylesheet"
    />

  <body>
    <div id="nav-container"></div>
    <button id="scrollTopBtn">
      <ion-icon name="chevron-up-outline"></ion-icon>
    </button>

    <div class="obra-detalle__container">
      <img src="" alt="" class="obra-detalle__img-ppal" />
      <div class="obra-detalle__grid">
        <h3 class="obra-detalle__titulo"></h3>
        <p class="obra-detalle__rol"></p>
        <h4 class="obra-detalle__descripcion-corta"></h4>

        <div class="obra-detalle__galeria"></div>
        <p class="obra-detalle__descripcion-larga"></p>

        <div class="obra-detalle__video"></div>
      </div>
    </div>

    <div id="footer-container"></div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <script src="/JS/dist/ui/render-obra-detalle.js" type="module"></script>
    <script src="/JS/dist/main.js" type="module"></script>
  </body>
